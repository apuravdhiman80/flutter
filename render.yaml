services:
  - type: web
    name: sightline-yolo-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: MODEL_NAME
        value: yolo26n.pt
      - key: FRONTEND_ORIGINS
        value: https://flutter-five-livid.vercel.app
